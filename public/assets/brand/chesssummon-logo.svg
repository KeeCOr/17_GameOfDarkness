<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-label="Chess of Dark logo">
  <defs>
    <linearGradient id="darkGold" x1="94" y1="46" x2="668" y2="238" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff8d0"/>
      <stop offset=".2" stop-color="#f1c960"/>
      <stop offset=".46" stop-color="#9a5d1d"/>
      <stop offset=".7" stop-color="#ffeaa2"/>
      <stop offset="1" stop-color="#6d4314"/>
    </linearGradient>
    <linearGradient id="brightEdge" x1="122" y1="56" x2="640" y2="226" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fffdf0"/>
      <stop offset=".34" stop-color="#ffde80"/>
      <stop offset=".68" stop-color="#7b4513"/>
      <stop offset="1" stop-color="#fff0b4"/>
    </linearGradient>
    <linearGradient id="blackSteel" x1="380" y1="62" x2="380" y2="244" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1b263c"/>
      <stop offset=".48" stop-color="#070b14"/>
      <stop offset="1" stop-color="#010307"/>
    </linearGradient>
    <linearGradient id="summonBlue" x1="318" y1="92" x2="442" y2="224" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f0ffff"/>
      <stop offset=".28" stop-color="#64f3ff"/>
      <stop offset=".68" stop-color="#0b8497"/>
      <stop offset="1" stop-color="#043442"/>
    </linearGradient>
    <radialGradient id="cyanGem" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(380 175) scale(22 16)">
      <stop stop-color="#ffffff"/>
      <stop offset=".3" stop-color="#67f5ff"/>
      <stop offset=".72" stop-color="#0c879a"/>
      <stop offset="1" stop-color="#042f3a"/>
    </radialGradient>
    <filter id="softDrop" x="-14%" y="-24%" width="128%" height="156%">
      <feDropShadow dx="0" dy="10" stdDeviation="5" flood-color="#000000" flood-opacity=".9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="2" flood-color="#f6cb68" flood-opacity=".34"/>
    </filter>
    <filter id="cyanGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.1" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="760" height="300" fill="#02050b" opacity=".01"/>
  <g id="integratedSummonWordmark" filter="url(#softDrop)">
    <path d="M88 156h178l25-21h178l25 21h178" stroke="#03060b" stroke-width="16" stroke-linecap="round" opacity=".78"/>
    <path d="M104 156h162l25-21h178l25 21h162" stroke="url(#darkGold)" stroke-width="6" stroke-linecap="round"/>

    <text x="380" y="126" text-anchor="middle"
      font-family="Cinzel, Trajan Pro, Georgia, 'Times New Roman', serif"
      font-size="82" font-weight="900" letter-spacing="5"
      fill="#060300" stroke="#02050b" stroke-width="15" stroke-linejoin="round">CHESS</text>
    <text x="380" y="126" text-anchor="middle"
      font-family="Cinzel, Trajan Pro, Georgia, 'Times New Roman', serif"
      font-size="82" font-weight="900" letter-spacing="5"
      fill="url(#darkGold)" stroke="url(#brightEdge)" stroke-width="1.7">CHESS</text>

    <g id="letterSummonCrown" transform="translate(380 151)">
      <path d="M-54 3h108l16 19-16 19H-54L-70 22z" fill="url(#blackSteel)" stroke="#050812" stroke-width="8" stroke-linejoin="round"/>
      <path d="M-54 3h108l16 19-16 19H-54L-70 22z" fill="none" stroke="url(#darkGold)" stroke-width="3" stroke-linejoin="round"/>
      <path d="M-18 19-8 4 0 20 8 4 18 19" fill="none" stroke="url(#brightEdge)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M0 6v31M-23 37h46" stroke="#1a0d02" stroke-width="8" stroke-linecap="round"/>
      <path d="M0 6v31M-23 37h46" stroke="url(#darkGold)" stroke-width="5" stroke-linecap="round"/>
      <path d="M0 6 15 22 0 38-15 22z" fill="url(#cyanGem)" stroke="#fff4bf" stroke-width="2.5" filter="url(#cyanGlow)"/>
    </g>

    <text x="380" y="227" text-anchor="middle"
      font-family="Cinzel, Trajan Pro, Georgia, 'Times New Roman', serif"
      font-size="84" font-weight="900" letter-spacing="3"
      fill="#060300" stroke="#02050b" stroke-width="15" stroke-linejoin="round">DARK</text>
    <text x="380" y="227" text-anchor="middle"
      font-family="Cinzel, Trajan Pro, Georgia, 'Times New Roman', serif"
      font-size="84" font-weight="900" letter-spacing="3"
      fill="url(#darkGold)" stroke="url(#brightEdge)" stroke-width="1.7">DARK</text>

    <path d="M160 248h151l22-13h94l22 13h151" fill="none" stroke="#050812" stroke-width="9" stroke-linecap="round" opacity=".7"/>
    <path d="M176 248h135l22-13h94l22 13h135" fill="none" stroke="url(#darkGold)" stroke-width="4" stroke-linecap="round"/>
    <path d="M259 270h242" stroke="#6d471b" stroke-width="2" stroke-linecap="round" opacity=".8"/>
  </g>
</svg>
